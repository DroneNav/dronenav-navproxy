protocol: MAVLink
platform: ArduPilot

commands:
  MAV_CMD_NAV_WAYPOINT:
    id: 16
    description: Navigate to a waypoint.

    emission:
      message: MISSION_ITEM_INT
      frame: MAV_FRAME_GLOBAL_RELATIVE_ALT

    parameters:
      - position: 1
        name: hold_time_seconds
        type: number
        required: false
        default: 0
        minimum: 0
        emit:
          field: param1
          encoding: float

      - position: 2
        name: acceptance_radius_meters
        type: number
        required: false
        default: 0
        minimum: 0
        emit:
          field: param2
          encoding: float

      - position: 3
        name: pass_radius_meters
        type: number
        required: false
        default: 0
        minimum: 0
        emit:
          field: param3
          encoding: float

      - position: 4
        name: yaw_degrees
        type: number
        required: false
        default: 0
        minimum: 0
        maximum: 360
        emit:
          field: param4
          encoding: float

      - position: 5
        name: latitude
        type: number
        required: true
        minimum: -90
        maximum: 90
        emit:
          field: x
          encoding: degree_e7

      - position: 6
        name: longitude
        type: number
        required: true
        minimum: -180
        maximum: 180
        emit:
          field: y
          encoding: degree_e7

      - position: 7
        name: altitude_meters
        type: number
        required: true
        emit:
          field: z
          encoding: float

  MAV_CMD_NAV_TAKEOFF:
    id: 22
    description: Command the aircraft to take off to the specified altitude.

    emission:
      message: MISSION_ITEM_INT
      frame: MAV_FRAME_GLOBAL_RELATIVE_ALT

    parameters:
      - position: 1
        name: minimum_pitch_degrees
        type: number
        required: false
        default: 0
        minimum: 0
        maximum: 90
        emit:
          field: param1
          encoding: float

      - position: 2
        name: reserved_2
        type: number
        required: false
        default: 0
        emit:
          field: param2
          encoding: float

      - position: 3
        name: reserved_3
        type: number
        required: false
        default: 0
        emit:
          field: param3
          encoding: float

      - position: 4
        name: yaw_degrees
        type: number
        required: false
        default: 0
        minimum: 0
        maximum: 360
        emit:
          field: param4
          encoding: float

      - position: 5
        name: latitude
        type: number
        required: true
        minimum: -90
        maximum: 90
        emit:
          field: x
          encoding: degree_e7

      - position: 6
        name: longitude
        type: number
        required: true
        minimum: -180
        maximum: 180
        emit:
          field: y
          encoding: degree_e7

      - position: 7
        name: altitude_meters
        type: number
        required: true
        emit:
          field: z
          encoding: float

  MAV_CMD_NAV_LAND:
    id: 21
    description: Land the aircraft at the specified coordinate.

    emission:
      message: MISSION_ITEM_INT
      frame: MAV_FRAME_GLOBAL_RELATIVE_ALT

    parameters:
      - position: 1
        name: reserved_1
        type: number
        required: false
        default: 0
        emit:
          field: param1
          encoding: float

      - position: 2
        name: reserved_2
        type: number
        required: false
        default: 0
        emit:
          field: param2
          encoding: float

      - position: 3
        name: reserved_3
        type: number
        required: false
        default: 0
        emit:
          field: param3
          encoding: float

      - position: 4
        name: yaw_degrees
        type: number
        required: false
        default: 0
        minimum: 0
        maximum: 360
        emit:
          field: param4
          encoding: float

      - position: 5
        name: latitude
        type: number
        required: true
        minimum: -90
        maximum: 90
        emit:
          field: x
          encoding: degree_e7

      - position: 6
        name: longitude
        type: number
        required: true
        minimum: -180
        maximum: 180
        emit:
          field: y
          encoding: degree_e7

      - position: 7
        name: altitude_meters
        type: number
        required: false
        default: 0
        emit:
          field: z
          encoding: float

